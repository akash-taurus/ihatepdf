name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Core suite on both platforms. Optional backends (pyHanko, Tesseract,
  # LibreOffice) and the GUI are absent here on purpose: their tests skip, so
  # this job proves ihatepdf works with nothing but its runtime dependencies.
  core:
    name: core · ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install pymupdf pypdf Pillow pytest black

      - name: Check formatting
        run: black --check --diff .

      - name: Run tests
        run: pytest -q

  # Optional signing backend, exercised for real (certificates are generated
  # on the fly by the tests, nothing sensitive is stored in the repo).
  optional:
    name: optional backends
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r requirements-optional.txt

      - name: Run tests
        run: pytest -q

  # The desktop app: PySide6 is a heavy download, so it gets its own job and
  # runs headless via the offscreen Qt platform plugin.
  gui:
    name: desktop · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install pymupdf pypdf Pillow PySide6 pytest

      # Qt wheels need these system libraries on a bare runner, otherwise
      # importing PySide6.QtWidgets fails with "libEGL.so.1: cannot open".
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1

      - name: Run GUI tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q tests/test_gui.py tests/test_app_tools.py
