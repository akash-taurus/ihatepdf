# Tool configuration only (no build backend): this project is run from source
# (python app/main.py, python cli.py) or frozen with PyInstaller.

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = '''
/(
    \.venv
  | \.venv-build
  | build
  | dist
)/
'''

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
